<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1560" height="760" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <text x="40" y="48" font-size="22" font-weight="bold" fill="#333333">localization 仓库 — localization_parser + soft_dtu</text>
  <text x="40" y="72" font-size="13" fill="#777777">北云/华测双品牌 RTK 归一化定位产品层：解析 · 门控 · 定频发布 · 落盘留证 · 弱网中继 · ROS2</text>

  <!-- arrows: input to transport -->
  <line x1="280" y1="200" x2="356" y2="240" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="280" y1="560" x2="356" y2="530" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- pipeline arrows -->
  <line x1="560" y1="255" x2="616" y2="255" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="255" x2="896" y2="255" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1120" y1="255" x2="1176" y2="255" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- recorder branch -->
  <line x1="470" y1="300" x2="470" y2="416" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="360" font-size="11" fill="#555" text-anchor="middle">原始流旁路</text>

  <!-- outputs -->
  <line x1="1350" y1="215" x2="1406" y2="180" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1350" y1="295" x2="1406" y2="330" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- soft_dtu arrow -->
  <line x1="700" y1="640" x2="356" y2="640" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="628" font-size="11" fill="#555" text-anchor="middle">差分数据转发（RTCM）</text>

  <!-- input: receiver -->
  <rect x="40" y="150" width="240" height="100" rx="4" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.5"/>
  <text x="160" y="185" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">GNSS/INS 接收机</text>
  <text x="160" y="207" font-size="11" fill="#444" text-anchor="middle">北云 / 华测 二进制流</text>
  <text x="160" y="225" font-size="11" fill="#444" text-anchor="middle">TCP client 主动连入 :44445</text>
  <text x="160" y="241" font-size="10" fill="#666" text-anchor="middle">local_client_ip 白名单</text>

  <!-- input: VCU -->
  <rect x="40" y="520" width="240" height="70" rx="4" fill="#B0E3E6" stroke="#0E8088" stroke-width="1.5"/>
  <text x="160" y="548" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">VCU 车身数据</text>
  <text x="160" y="568" font-size="11" fill="#444" text-anchor="middle">/vcu/vcu_data（仅链路观测）</text>

  <!-- ===== localization_parser container ===== -->
  <rect x="360" y="110" width="990" height="420" rx="6" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="380" y="136" font-size="13" font-weight="bold" fill="#666666">localization_parser（单进程，四层职责混合：传输/解析/门控/发布 + 落盘）</text>

  <!-- layer 1 transport -->
  <rect x="380" y="170" width="180" height="130" rx="4" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
  <text x="470" y="200" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">transport 层</text>
  <text x="470" y="222" font-size="10" fill="#444" text-anchor="middle">TCP server :44445</text>
  <text x="470" y="238" font-size="10" fill="#444" text-anchor="middle">断线重连 / 超时检测</text>
  <text x="470" y="258" font-size="10" fill="#444" text-anchor="middle">data_recorder 旁路</text>
  <text x="470" y="274" font-size="10" fill="#444" text-anchor="middle">（录制线程不阻塞主链）</text>

  <!-- layer 2 parser -->
  <rect x="620" y="170" width="220" height="130" rx="4" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <text x="730" y="200" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">parser 层（协议解析）</text>
  <text x="730" y="222" font-size="10" fill="#444" text-anchor="middle">beiyun_parser / huace_parser</text>
  <text x="730" y="238" font-size="10" fill="#444" text-anchor="middle">二进制帧解包 · checksum 校验</text>
  <text x="730" y="258" font-size="10" fill="#444" text-anchor="middle">闰秒 GPS→UTC · ENU 投影</text>
  <text x="730" y="274" font-size="10" fill="#444" text-anchor="middle">RTK 偏移补偿（杆臂/ yaw）</text>

  <!-- layer 3 processor -->
  <rect x="900" y="170" width="220" height="130" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <text x="1010" y="196" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">processor 层（一次判断）</text>
  <text x="1010" y="216" font-size="10" fill="#444" text-anchor="middle">质量门控 → FaultCode 9 种</text>
  <text x="1010" y="232" font-size="10" fill="#444" text-anchor="middle">数据超时 / 解析失败 / INS 未收敛</text>
  <text x="1010" y="248" font-size="10" fill="#444" text-anchor="middle">星数不足 / 基线异常 / ENU 越界</text>
  <text x="1010" y="266" font-size="10" fill="#444" text-anchor="middle">float 宽限 20s · unfixed 5s</text>
  <text x="1010" y="286" font-size="10" fill="#B85450" text-anchor="middle">粘滞宽限 30s→GraceTimeout（152519 新增）</text>

  <!-- layer 4 ros bridge -->
  <rect x="1180" y="170" width="170" height="130" rx="4" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.5"/>
  <text x="1265" y="196" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">ros_bridge 层</text>
  <text x="1265" y="216" font-size="10" fill="#444" text-anchor="middle">定频 50Hz 重发布</text>
  <text x="1265" y="232" font-size="10" fill="#444" text-anchor="middle">丢帧检测</text>
  <text x="1265" y="248" font-size="10" fill="#444" text-anchor="middle">参数防御性校验</text>
  <text x="1265" y="266" font-size="10" fill="#444" text-anchor="middle">主 + aux 双话题</text>
  <text x="1265" y="286" font-size="10" fill="#B85450" text-anchor="middle">LocAlarm 故障自上报（新）</text>

  <!-- alarm output arrow -->
  <line x1="1350" y1="330" x2="1406" y2="440" stroke="#B85450" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- recorder box -->
  <rect x="380" y="420" width="300" height="90" rx="4" fill="#F5F5F5" stroke="#666666" stroke-width="1.2"/>
  <text x="530" y="450" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">原始流落盘 ~/data/localization_raw</text>
  <text x="530" y="470" font-size="10" fill="#444" text-anchor="middle">ICOM 2222/3333 · 按时间/大小切分 · 配额清理</text>
  <text x="530" y="488" font-size="10" fill="#444" text-anchor="middle">异常留证：前 120s + 后 60s padding</text>

  <!-- config note inside container -->
  <rect x="720" y="420" width="610" height="90" rx="4" fill="#F5F5F5" stroke="#666666" stroke-width="1.2"/>
  <text x="1025" y="450" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">关键配置（localization_parser.yaml）</text>
  <text x="1025" y="470" font-size="10" fill="#444" text-anchor="middle">原点 origin_lat/lon/height · 阈值 stars/heading_length/xyz/age · publish_rate_hz 50</text>
  <text x="1025" y="488" font-size="10" fill="#444" text-anchor="middle">localization_type 品牌选择 · 录制切分/清理策略</text>

  <!-- outputs -->
  <rect x="1410" y="130" width="130" height="100" rx="4" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <text x="1475" y="160" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">主话题</text>
  <text x="1475" y="180" font-size="9" fill="#444" text-anchor="middle">/localization/</text>
  <text x="1475" y="194" font-size="9" fill="#444" text-anchor="middle">localization_data</text>
  <text x="1475" y="212" font-size="9" fill="#444" text-anchor="middle">50Hz 定频</text>

  <rect x="1410" y="290" width="140" height="100" rx="4" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <text x="1480" y="320" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">aux 话题</text>
  <text x="1480" y="340" font-size="9" fill="#444" text-anchor="middle">_aux（pos_type /</text>
  <text x="1480" y="354" font-size="9" fill="#444" text-anchor="middle">fault_code / ins_status）</text>
  <text x="1480" y="372" font-size="9" fill="#444" text-anchor="middle">供 fusion 二次判决</text>

  <rect x="1410" y="400" width="140" height="100" rx="4" fill="#F8CECC" stroke="#B85450" stroke-width="1.5"/>
  <text x="1480" y="428" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">告警话题（新）</text>
  <text x="1480" y="446" font-size="9" fill="#444" text-anchor="middle">fault_code/localization_fault</text>
  <text x="1480" y="462" font-size="9" fill="#444" text-anchor="middle">告警码 202012 CRITICAL</text>
  <text x="1480" y="478" font-size="9" fill="#444" text-anchor="middle">ADD/RESET 状态对 → guardian</text>

  <!-- ===== soft_dtu container ===== -->
  <rect x="360" y="570" width="990" height="140" rx="6" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="380" y="596" font-size="13" font-weight="bold" fill="#666666">soft_dtu（弱网中继，enable_soft_dtu 默认关闭）</text>

  <rect x="380" y="610" width="200" height="80" rx="4" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
  <text x="480" y="642" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">RTK 差分中继</text>
  <text x="480" y="662" font-size="10" fill="#444" text-anchor="middle">4G/弱网链路转发差分数据</text>

  <rect x="620" y="610" width="180" height="80" rx="4" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
  <text x="710" y="638" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">心跳保活</text>
  <text x="710" y="656" font-size="9" fill="#444" text-anchor="middle">localization/soft_dtu/heartbeat</text>
  <text x="710" y="672" font-size="9" fill="#444" text-anchor="middle">1Hz 时间戳（话题名已改）</text>

  <rect x="840" y="610" width="260" height="80" rx="4" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.5"/>
  <text x="970" y="642" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">超时告警（告警码 102011）</text>
  <text x="970" y="662" font-size="10" fill="#444" text-anchor="middle">差分全断 / 无惯导连接 · 超时与限频可配</text>

  <rect x="1140" y="610" width="190" height="80" rx="4" fill="#F5F5F5" stroke="#666666" stroke-width="1.2"/>
  <text x="1235" y="642" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">矿区弱网场景</text>
  <text x="1235" y="662" font-size="10" fill="#444" text-anchor="middle">基站差分经中继到车端</text>

  <!-- bottom annotation -->
  <rect x="40" y="726" width="1500" height="1" fill="none"/>
</svg>
