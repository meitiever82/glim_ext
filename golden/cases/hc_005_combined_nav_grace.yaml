case: hc_005_combined_nav_grace
class: keep
brand: huace
description: 组合推算模式（sta=0x32）用 combined_nav_mod_time=30s 宽限——此处配置 2s 验证分支选择，2.5s 超时 → GraceTimeout

config:
  origin_lat: 44.50323451
  origin_lon: 92.91759315
  origin_height: 753.8173
  xyz_threshold: 10000
  stars_threshold: 10
  unfixed_time: 5.0
  combined_nav_mod_time: 2.0     # 参数扫描：验证组合推算走独立宽限
  rtk_float_grace_time: 20.0
  sticky_grace_time: 30.0
  single_point_age_threshold: 10.0
  heading_length: 1.6
  heading_length_threshold: 0.2
  data_timeout_sec: 10.0
  parse_fail_threshold: 200
  leap_seconds: 18

frames:
  - t: 0.05
    type: gpchc
    fields: {sta: "42", warning: "0000", solnsvs: "20", solnsvs2: "18", age: "1"}
  - t: 0.5
    type: gpchc
    fields: {sta: "32", warning: "0000", solnsvs: "20", solnsvs2: "18", age: "1"}
  # 宽限内（1.4s < 2.0s）
  - t: 1.4
    type: gpchc
    fields: {sta: "32", warning: "0000", solnsvs: "20", solnsvs2: "18", age: "1"}
  # 超时（2.6s > 2.0s）
  - t: 2.6
    type: gpchc
    fields: {sta: "32", warning: "0000", solnsvs: "20", solnsvs2: "18", age: "1"}
observe_until: 2.9
