case: by_005_sticky_recover
class: keep
brand: beiyun
description: 粘滞恢复——降级后宽限期内恢复 RTKFIXED，粘滞计时重置，is_valid 不闪断

config:
  origin_lat: 44.50323451
  origin_lon: 92.91759315
  origin_height: 753.8173
  xyz_threshold: 10000
  stars_threshold: 10
  unfixed_time: 5.0
  combined_nav_mod_time: 30.0
  rtk_float_grace_time: 20.0
  sticky_grace_time: 2.0
  single_point_age_threshold: 10.0
  heading_length: 1.6
  heading_length_threshold: 0.2
  data_timeout_sec: 10.0        # 调大避免 DataTimeout 干扰（隔离变量）
  parse_fail_threshold: 200
  leap_seconds: 18

frames:
  - t: 0.0
    type: gpgga
    fields: {sats: "18", age: "1.0", quality: "4", lat: "4430.1940706", lat_ns: "N", lon: "09255.0555890", lon_ew: "E", alt: "753.8"}
  - t: 0.01
    type: gpfpd
    fields: {nsv1: "18"}
  - t: 0.02
    type: headinga
    fields: {heading_type: "NARROW_INT", length: "1.601", solnsvs: "18", obs: "20"}
  - t: 0.05
    type: inspvaxa
    fields:
      ins_status: INS_SOLUTION_GOOD
      pos_type: INS_RTKFIXED
      lat: "44.50323451"
      lon: "92.91759315"
      alt: "753.8173"
  - t: 0.5
    type: inspvaxa
    fields:
      ins_status: INS_SOLUTION_GOOD
      pos_type: INS_PSRDIFF
      lat: "44.50323451"
      lon: "92.91759315"
      alt: "753.8173"
  # 宽限期内恢复固定
  - t: 1.5
    type: inspvaxa
    fields:
      ins_status: INS_SOLUTION_GOOD
      pos_type: INS_RTKFIXED
      lat: "44.50323451"
      lon: "92.91759315"
      alt: "753.8173"
  # 再次降级，重新起算粘滞（新一轮降级事件）
  - t: 2.0
    type: inspvaxa
    fields:
      ins_status: INS_SOLUTION_GOOD
      pos_type: INS_PSRDIFF
      lat: "44.50323451"
      lon: "92.91759315"
      alt: "753.8173"
  # 3.9s：距第二次降级 1.9s < 2s，仍有效
  - t: 3.9
    type: inspvaxa
    fields:
      ins_status: INS_SOLUTION_GOOD
      pos_type: INS_PSRDIFF
      lat: "44.50323451"
      lon: "92.91759315"
      alt: "753.8173"
observe_until: 4.2
