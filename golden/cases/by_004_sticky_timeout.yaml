case: by_004_sticky_timeout
class: keep
brand: beiyun
description: 粘滞状态机边界——fixed 后降级为 PSRDIFF（INS 良好），sticky_grace=2s 内沿用旧帧，超时判 GraceTimeout

config:
  origin_lat: 44.50323451
  origin_lon: 92.91759315
  origin_height: 753.8173
  xyz_threshold: 10000
  stars_threshold: 10
  unfixed_time: 5.0
  combined_nav_mod_time: 30.0
  rtk_float_grace_time: 20.0
  sticky_grace_time: 2.0        # 参数扫描：短宽限（真实 30s 用例见 by_012）
  single_point_age_threshold: 10.0
  heading_length: 1.6
  heading_length_threshold: 0.2
  data_timeout_sec: 10.0        # 调大避免 DataTimeout 干扰粘滞状态机（隔离变量）
  parse_fail_threshold: 200
  leap_seconds: 18

frames:
  - t: 0.0
    type: gpgga
    fields: {sats: "18", age: "1.0", quality: "4", lat: "4430.1940706", lat_ns: "N", lon: "09255.0555890", lon_ew: "E", alt: "753.8"}
  - t: 0.01
    type: gpfpd
    fields: {nsv1: "18"}
  - t: 0.02
    type: headinga
    fields: {heading_type: "NARROW_INT", length: "1.601", solnsvs: "18", obs: "20"}
  - t: 0.05
    type: inspvaxa
    fields:
      ins_status: INS_SOLUTION_GOOD
      pos_type: INS_RTKFIXED
      lat: "44.50323451"
      lon: "92.91759315"
      alt: "753.8173"
  # 降级为 PSRDIFF（INS 良好）→ 进入粘滞路径
  - t: 0.5
    type: inspvaxa
    fields:
      ins_status: INS_SOLUTION_GOOD
      pos_type: INS_PSRDIFF
      lat: "44.50323451"
      lon: "92.91759315"
      alt: "753.8173"
  # 宽限期内（1.5s < 2s）：仍沿用 valid
  - t: 1.5
    type: inspvaxa
    fields:
      ins_status: INS_SOLUTION_GOOD
      pos_type: INS_PSRDIFF
      lat: "44.50323451"
      lon: "92.91759315"
      alt: "753.8173"
  # 超时（2.7s > 2s）：判无效 + GraceTimeout + rtk_status 修正为 RtcmDiff
  - t: 2.7
    type: inspvaxa
    fields:
      ins_status: INS_SOLUTION_GOOD
      pos_type: INS_PSRDIFF
      lat: "44.50323451"
      lon: "92.91759315"
      alt: "753.8173"
observe_until: 3.0
