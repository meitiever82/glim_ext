# GNSS HMI 只读运行配置（生产）
# HMI 只订阅 gnss_bringup 的 ROS 话题与只读文件；不采集、不解算、不下发。
data_root: /data/gnsslog/hmi
db_path: /data/gnsslog/hmi/hmi.db

storage:
  enabled: false          # P0/P1 不落盘；P2 打开

# 旧自采集路径全部关闭（缺省 enabled=false，这里显式写出避免误开）
can:
  enabled: false
  channel: can0
corrections:
  enabled: false
  host: 127.0.0.1
  port: 6001
raw_obs:
  enabled: false
  host: 127.0.0.1
  port: 6002
gnss_solution:
  enabled: false
  host: 127.0.0.1
  port: 0
  listen: false

can_channel: can0
reserve:
  corrections_port: 0
  raw_obs_port: 0
retention_days: 14
disk_watermark_pct: 85.0
db_retention_days: 30

rtkrcv:
  binary: ""              # 空 = 不起第二套 rtkrcv
  sol_port: 15020

publish:
  enabled: false

diagnosis:
  local_fallback: false   # 诊断以 /gnss/diagnostics 为唯一来源
  close_hysteresis_s: 10.0

web:
  port: 8080
  host: 0.0.0.0
  tiles_path: /data/gnsslog/hmi/tiles/mine.mbtiles
  static_dir: ""

ros:
  enabled: true
  timeout_warn_s: 5.0
  topics:
    - {topic: /rtkrcv_node/rtk_fix,      kind: rtkfix,     source: app,   qos: reliable}
    - {topic: /gnss_cgi610/rtk_fix,      kind: rtkfix,     source: fused, qos: auto}
    - {topic: /rtkrcv_node/stat,         kind: stat,       qos: reliable}
    - {topic: /gnss/diagnostics,         kind: diagnostic, source: gnss,  qos: auto}
    - {topic: /rtkrcv_node/diagnostics,  kind: diagnostic, source: rtkrcv,qos: auto}
    - {topic: /gnss/rtcm_corrections,    kind: rate,       name: corr,    qos: auto}
    - {topic: /gnss/raw_obs,             kind: rate,       name: obs,     qos: auto}
