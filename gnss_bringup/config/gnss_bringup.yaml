rtcm_bridge:
  ros__parameters:
    streams: ["rtcm_corrections", "raw_obs"]
    rtcm_corrections:
      # TODO(现场确认, spec §13 P0):平台差分的 IP/端口,以及是我们连它(listen=false)
      # 还是它推给我们(listen=true)。协议已确认为裸 TCP 无解析(rtk-monitor 无 NTRIP)。
      #
      # 部署注意(final-fix-wave 第 7 项):host 的含义随 listen 的取值整个
      # 反过来——listen=false 时 host 是"对端"的地址(我们主动去连它);
      # listen=true 时 host 是"本机"的绑定地址(对端反过来连我们,通常写
      # "0.0.0.0" 或某张网卡的地址,而不是对端的 IP)。如果只改了 listen、
      # 忘了把 host 也换成另一种含义下该填的值(最容易踩的是:改成
      # listen=true 却把 host 留成原来那个平台/板卡的 IP),这条流会
      # 永久死掉——bind() 会失败(比如 EADDRNOTAVAIL:本机压根没有那个
      # 地址),日志里只有一行 ERROR,此后这个节点会一直"看起来在跑",却
      # 再也不会有任何数据。改 listen 的时候,必须同时检查/改 host。
      host: "127.0.0.1"
      port: 15031
      listen: false  # false=我们主动连 host:port(host=对端地址);true=本机监听 host:port 等对端连入(host=本机绑定地址,通常是 0.0.0.0)——见上面 host 旁的注意事项
      topic: "/gnss/rtcm_corrections"
      # 默认等于流名("rtcm_corrections");按需覆盖。
      frame_id: "rtcm_corrections"
      # 断线重连的初始/上限退避秒数,以及判定"卡住无数据"的空闲秒数——
      # 现场是隧道内的弱链路,这三个是运维最可能需要收紧或放宽的旋钮。
      initial_backoff_s: 1.0
      max_backoff_s: 30.0
      idle_timeout_s: 30.0
    raw_obs:
      # TODO(现场确认, spec §13 P0):板卡原始观测输出的 IP/端口或串口转发端点
      # host/listen 的含义与上面 rtcm_corrections 完全一样(见那边的详细
      # 注意事项):listen=false 时 host 是对端地址,listen=true 时 host 是
      # 本机绑定地址——两者不能只改一半。
      host: "127.0.0.1"
      port: 15032
      listen: false  # false=我们主动连 host:port(host=对端地址);true=本机监听 host:port 等对端连入(host=本机绑定地址,通常是 0.0.0.0)
      topic: "/gnss/raw_obs"
      frame_id: "raw_obs"
      initial_backoff_s: 1.0
      max_backoff_s: 30.0
      idle_timeout_s: 30.0

rtkrcv_node:
  ros__parameters:
    # RTKLIB-EX 2.5.1 的 rtkrcv。裸名字按 PATH 查找(sudo cmake --install 装在
    # /usr/local/bin);找不到时节点启动即失败并打印 PATH。安装方法见 README
    # 「安装 RTKLIB-EX 2.5.1」——不要用 apt 的 rtklib(2.4.3 b34 不认 -nc)。
    binary: "rtkrcv"
    run_dir: "/tmp/rtkrcv_run"
    # 故意不用 RtkrcvConfParams 的内置默认值(rtkrcv_conf.hpp 里 corr_port=15031、
    # obs_port=15032)——那两个端口号与上面 rtcm_bridge.rtcm_corrections.port
    # (15031)、rtcm_bridge.raw_obs.port(15032)撞了。当前两者互不冲突是因为
    # rtcm_bridge 两路流都是 listen=false(主动去连平台/板卡,不在本机绑定这两个
    # 端口);但这四项都在"现场待确认"名单里(见 README),一旦某路改成
    # listen=true(平台改成推流),就会在本机绑定同一个端口号,与 rtkrcv_node
    # 这里的 LocalReserver 抢占同一个端口。这里用 15041/15042 这组不重叠的端口号
    # 从根上避免这个坑——**不要**把它们"顺手"改回 15031/15032 的库内置默认值。
    corr_port: 15041
    obs_port: 15042
    sol_port: 15020
    # TODO(现场确认, spec §13 P0):板卡原始观测格式。rtk-monitor 假定 rtcm3。
    obs_format: "rtcm3"
    corr_format: "rtcm3"
    pos_mode: "kinematic"
    navsys: 63
    elmask: 10.0
    ar_mode: "continuous"
    # 基准站坐标来源(conf 的 ant2-postype)。"rtcm":取平台差分流里的 RTCM
    # 1005/1006(默认——前提是差分流带这两条电文,现场待确认);"single":用基准站
    # 观测的单点解。不写这个键时 rtkrcv 默认 llh 0,0,0,RTK 一条解都不会输出
    # (2026-09-14 用 RTKLIB-EX 2.5.1 实测)。
    base_pos_type: "rtcm"
    # 北斗 / GLONASS 模糊度固定。取值与 RTKLIB-EX 2.5.1 自身默认一致,显式写出是
    # 为了换版本时默认值不会悄悄变化;现场按固定率再调(bds_ar_mode: off|on,
    # glo_ar_mode: off|on|autocal|fix-and-hold)。
    bds_ar_mode: "off"
    glo_ar_mode: "fix-and-hold"

    # rtcm_bridge 发布上行数据用的话题名,必须与上面 rtcm_bridge 的
    # topic 取值一致——这里重复写一遍是因为两个节点各自独立声明参数,
    # ROS 不会自动对齐。
    corrections_topic: "/gnss/rtcm_corrections"
    raw_obs_topic: "/gnss/raw_obs"
    frame_id: "gnss"
    # GPST-UTC 闰秒偏移。截至本文件编写时为 18;IERS 宣布新的闰秒后需要
    # 手动更新此值(下一次可能的闰秒插入前会有公告)。
    leap_seconds: 18
    # 传给 rtkrcv 二进制的额外命令行参数,原样透传。默认是空列表,代码侧
    # 已经这样默认,这里特意不写 `args: []`——ROS2 的 YAML 参数加载器
    # 无法从一个空列表推断元素类型,`args: []` 会在节点启动时抛
    # InvalidParameterValueException 直接崩溃(已实测复现)。需要传参数时
    # 取消注释并至少填一项,例如:
    # args: ["-s"]

    # rtkrcv 子进程崩溃/退出后的重启退避:首次等 restart_delay_s 秒重启;
    # 如果进程存活不足 crash_loop_life_s 秒就又退出,视为崩溃循环,退避
    # 翻倍直至 max_restart_delay_s。
    restart_delay_s: 5.0
    crash_loop_life_s: 30.0
    max_restart_delay_s: 60.0

    # 连接 rtkrcv 解算输出端口(sol_port)的重连退避,以及判定"连上了但
    # 长时间没有新的一行解"的空闲秒数——隧道内 GNSS 信号本就时断时续,
    # 这三个是现场最可能需要按实际链路质量调整的参数。
    # 注意:sol_idle_timeout_s 不接受 0(节点会拒绝启动),因为 0 会被
    # 底层 TcpStream 当成"彻底关闭空闲检测"的隐藏哨兵值——这条自愈能力
    # 是本节点存在的意义之一,不允许通过配置悄悄关掉。
    sol_initial_backoff_s: 1.0
    sol_max_backoff_s: 30.0
    sol_idle_timeout_s: 30.0

    # 轮询 run_dir 下最新 .stat 文件、发现新增字节并转发的间隔。
    stat_poll_interval_s: 0.2

    # ~/diagnostics(1 Hz)在超过这么多秒没有解算行时转为 WARN。隧道内没有解属正常,
    # 这个 WARN 在隧道里是预期的;开阔天空下持续 WARN 才需要排查。
    health_no_solution_warn_s: 30.0

pos_writer:
  ros__parameters:
    # .pos 落盘的根目录,实际文件路径是 "<root>/YYYYMMDD/<source>.pos"
    # (YYYYMMDD 按 time_system 换算到 UTC 的自然日,午夜零点换文件,与
    # 下面 rosbag2 分卷的边界是两套不同的机制——见 README「rosbag2 录制」
    # 一节)。现场部署前请确认这个路径所在磁盘有足够空间且可写。
    root: "/data/gnss/pos"
    # 每一路各自独立抽稀、独立轮转、独立写文件;一路失败(打不开/写不进)
    # 不影响其它路(pos_writer_node.cpp 的设计要求)。
    #
    # final-fix-wave 第 3 项:默认只接入一路——"can"(gnss_cgi610 驱动,
    # driver_ws 里的 gnss_chcnav 节点,发布到下面 can.topic)。此前默认是
    # ["can", "gpchc", "rtkrcv"],但:
    #   - "gpchc" 对应的话题 /gnss_cgi610/rtk_fix_gpchc 没有任何发布者——
    #     gnss_cgi610 驱动只发布一路 RtkFix(即 can 这一路),不存在"两种
    #     协议/接口各出一路 RtkFix"这回事(旧注释有误,已改正)。
    #   - "rtkrcv" 这一路依赖 rtkrcv_node,而 launch 文件里 enable_rtkrcv
    #     默认是 false,rtkrcv_node 默认不会被启动。
    #   默认三路里有两路在默认配置下必然永久沉默,每 5 秒各报一次 WARN——
    #   现场很快会把这条本该报警的沉默告警当成"正常噪音"忽略掉,这正是
    #   沉默检测存在的意义被自己的默认配置废掉。
    #
    # 现场需要接入 rtkrcv 这一路时:先 `-p enable_rtkrcv:=true`(或在覆盖
    # 文件里打开它)启动 rtkrcv_node,再把这里改成
    # `sources: ["can", "rtkrcv"]`;如果 gnss_cgi610 驱动确实会发布
    # gpchc 这一路(现场协议确认之后),再加上 "gpchc"。注意下面只有 can 的
    # topic 映射是生效的,gpchc/rtkrcv 两行是注释:把名字加进 sources 时必须
    # 同时取消对应那一行的注释——否则 <name>.topic 会回落到默认值
    # "/gnss/<name>",那个话题没有任何发布者,现象只是一条沉默告警。
    sources: ["can"]
    # 1 Hz 抽稀周期(spec §5.3)。落盘的是"每 period_s 秒取一条"的摘要,不是
    # 全量流——全量原始数据由下面的 rosbag2 录制脚本另外负责。
    period_s: 1.0
    # 写出到 .pos 文件里的时间列用的时间系统,只接受 "GPST" 或 "UTC"
    # (拼错/大小写不对会在启动时报错拒绝,不会被悄悄当成默认值——见
    # pos_writer_params.hpp 里 parse_pos_time_system 的注释)。
    time_system: "GPST"
    # GPST-UTC 闰秒偏移,与上面 rtkrcv_node.leap_seconds 同一个值、同样需要
    # 在 IERS 宣布新闰秒后手动更新;这里单独声明是因为 pos_writer 是独立
    # 进程,不会自动读取 rtkrcv_node 的参数。
    leap_seconds: 18
    # 每一路持续这么多秒没有写出任何一条记录就报警一次(节流,不刷屏)——
    # 独立于消息到达的 wall-clock 定时检查,能发现"订阅了错话题/QoS 不匹配/
    # 对端没启动"这类永远不会触发回调的沉默源。默认 10 秒,比 period_s 的
    # 常见取值(1 秒)宽松一个数量级,不会对正常的 1 Hz 抖动误报。
    silence_timeout_s: 10.0
    # 每一路的订阅话题;pos_writer 固定用 reliable QoS 订阅(与 rtkrcv_node
    # 发布 ~/rtk_fix 用的 QoS 一致),如果对端发布者是 best_effort,同样会
    # 表现为持续沉默——见上面 silence_timeout_s 的告警文案。
    #
    # 只有出现在上面 sources 列表里的名字,pos_writer_node 才会真的用
    # declare_parameter("<name>.topic", ...) 声明这个参数——不在 sources
    # 里的名字对应的这一行不会被节点读取(YAML 键与实际生效的已声明参数
    # 保持一致,final-fix-wave 第 3 项)。gpchc/rtkrcv 两行注释掉,是因为
    # 默认的 sources 只有 "can";现场把某个名字加进 sources 时,取消对应
    # 这一行的注释即可,topic 值不需要改。
    can:    { topic: "/gnss_cgi610/rtk_fix" }
    # gpchc:  { topic: "/gnss_cgi610/rtk_fix_gpchc" }
    # rtkrcv: { topic: "/rtkrcv_node/rtk_fix" }

gnss_diag:
  ros__parameters:
    # 诊断落盘根目录:<root>/YYYYMMDD/events.log(事件)、<root>/YYYYMMDD/base.pos(基站坐标史)、
    # <root>/base_baseline(基站基线)。与 pos_writer.root 相同,诊断文件与 .pos 落在同一个
    # 日期目录里(spec §5.3),清理节点也按同一个目录一起清。
    root: "/data/gnss/pos"
    # 四路输入。solution_topic 需要 enable_rtkrcv:=true 才有数据;stat_topic 同样来自 rtkrcv_node。
    corrections_topic: "/gnss/rtcm_corrections"
    solution_topic: "/rtkrcv_node/rtk_fix"
    device_topic: "/gnss_cgi610/rtk_fix"
    stat_topic: "/rtkrcv_node/stat"
    # solver_enabled 由 launch 按 enable_rtkrcv 注入,这里不写。
    #
    # 注意:下面的秒数/米数一律写成带小数点的形式(60.0 而不是 60)——ROS 参数类型严格,
    # 写成整数会在启动时因类型不符拒绝启动。
    #
    # 启动(以及时钟回跳重建引擎)后的宽限期:只接收数据、不判定,避免 rtkrcv 收敛前每次开机
    # 都记一条 no_solution。代价:宽限期内真实的差分中断等故障晚这么多秒才记录。
    startup_grace_s: 60.0
    # ROS 时间回退超过这么多秒视为时钟回跳(回放 bag 重新开始、系统校时):关闭已开事件并重建引擎
    clock_jump_tolerance_s: 1.0
    # 两路解都在到达、却连续这么多秒没配上对时打一次 WARN(device_divergence 此时无法判定)
    unpaired_warn_s: 60.0
    # 控制点(abs_ref_shift 规则):三个等长数组。没有控制点时整段保持注释——
    # ROS 无法从空列表推断类型(同 rtkrcv_node.args 的说明)。经纬度写成带小数点的数。
    # control_points:
    #   names: ["K1"]
    #   lat: [44.50123456]
    #   lon: [90.28765432]
    # 规则阈值,默认值与 gnss_core::DiagnosisConfig 相同(移植自 rtk-monitor,
    # 本项目新增项见 docs/gnss/plans/2026-09-15-round3a-diagnosis-core.md「设计决定」)
    diagnosis:
      corr_gap_s: 3.0
      age_max_s: 10.0
      base_shift_m: 0.1
      min_sats: 6
      resid_max_m: 2.0
      low_el_deg: 20.0
      low_snr_dbhz: 35.0
      min_ratio: 3.0
      slip_max_per_30s: 5
      divergence_sigma: 3.0
      divergence_hold_s: 5.0
      close_hysteresis_s: 10.0
      sol_stale_s: 5.0
      abs_ref_max_m: 0.2
      abs_ref_radius_m: 3.0
      divergence_window_s: 600.0
      divergence_min_samples: 60
      divergence_sigma_floor_m: 0.05
      # 学到的偏差 σ 上限(维护者 2026-09-15 决定):学习部分给出的阈值最多 3 × 0.10 = 0.30 m,
      # 更大的持续偏差不会被学成正常;rtkrcv 浮点解时的当前 σ 不受此限
      divergence_sigma_max_m: 0.10
      divergence_pair_max_dt_s: 2.0
      divergence_epoch_max_dt_s: 0.1
      base_warmup_s: 600.0

gnss_cleanup:
  ros__parameters:
    # bag_root 由 launch 注入(默认 $GNSS_BAG_ROOT,未设置时 $HOME/gnss_bags,与 record_gnss.sh 一致)。
    # .pos 与诊断文件的根目录,与 pos_writer.root / gnss_diag.root 相同
    pos_root: "/data/gnss/pos"
    # 超过这么多天的日期目录/录包删除;今天的、以及每个根目录下最新的一项永不删
    retention_days: 14
    # 所在盘用量高于这个百分比时,从最旧的开始继续删,直到低于水位(同样不删今天与最新一项)
    watermark_pct: 85.0
    # 启动时先清一轮,之后每隔这么多秒一轮
    interval_s: 3600.0
